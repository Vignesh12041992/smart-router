version: "3.8"

services:
  # Floci provides immediate, zero-token local AWS infrastructure (DynamoDB & S3)
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    environment:
      - FLOCI_STORAGE_MODE=hybrid
      - FLOCI_HOSTNAME=floci
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # EverOS manages semantic tracking, markdown log stores, and deduplication
  everos:
    image: evermind-ai/everos:latest
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=dummy_not_needed_for_local_demo
    volumes:
      - ~/.everos:/root/.everos
    depends_on:
      - floci
