<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Router</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0b0f19; color: #f1f5f9; display: flex; min-height: 100vh; margin: 0; }
    .sidebar { width: 300px; background: #111827; border-right: 1px solid #1f2937; padding: 1.5rem; }
    .main-content { flex: 1; padding: 2.5rem; overflow-y: auto; }
    h2, h3 { color: #38bdf8; margin-top: 0; }
    textarea { width: 100%; height: 110px; background: #1f2937; border: 1px solid #374151; border-radius: 8px; color: #fff; padding: 1rem; font-size: 1rem; resize: none; box-sizing: border-box; }
    button { background: #38bdf8; color: #0b0f19; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 1rem; }
    button:disabled { opacity: 0.5; cursor: default; }
    .status { color: #94a3b8; font-size: 0.85rem; margin-bottom: 1rem; }
    .metrics { display: flex; gap: 1rem; margin: 1.5rem 0; flex-wrap: wrap; }
    .card { flex: 1; min-width: 140px; background: #1e293b; padding: 1rem; border-radius: 8px; text-align: center; border: 1px solid #334155; }
    .val { font-size: 1.4rem; font-weight: bold; color: #38bdf8; margin-top: 0.25rem; word-break: break-all; }
    .terminal { background: #020617; border: 1px solid #1e293b; padding: 1.5rem; border-radius: 8px; min-height: 200px; font-family: monospace; white-space: pre-wrap; }
    .hist-item { background: #1f2937; padding: 0.75rem; border-radius: 6px; margin-bottom: 0.75rem; font-size: 0.85rem; border-left: 4px solid #38bdf8; }
    .cache-badge { background: #22c55e; color: #fff; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; float: right; }
    @media (max-width: 700px) { body { flex-direction: column; } .sidebar { width: auto; border-right: none; border-bottom: 1px solid #1f2937; } .main-content { padding: 1rem; } }
  </style>
</head>
<body>

  <div class="sidebar">
    <h3>History</h3>
    <div id="historyList">
      <div style="color: #6b7280; font-style: italic;">No prompts yet.</div>
    </div>
  </div>

  <div class="main-content">
    <h2>Smart Router</h2>
    <div id="status" class="status">Checking engine...</div>
    <textarea id="txtInput" placeholder="Type a prompt (e.g. Write a python script to multiply two matrices)..."></textarea>
    <button id="sendBtn" onclick="dispatchPipeline()">Route &amp; Run</button>

    <div class="metrics">
      <div class="card"><div>Model</div><div id="mModel" class="val">-</div></div>
      <div class="card"><div>Complexity (0-3)</div><div id="mScore" class="val">-</div></div>
      <div class="card"><div>Confidence</div><div id="mConf" class="val">-</div></div>
      <div class="card"><div>Cache</div><div id="mCache" class="val">-</div></div>
    </div>

    <h3>Answer</h3>
    <div id="term" class="terminal">Waiting for a prompt...</div>
  </div>

  <script>
    fetch("/api/status").then(r => r.json()).then(s => {
      document.getElementById("status").innerText =
        `Engine: ${s.engine} · Ollama: ${s.ollamaOnline ? `online (${s.models.length} models)` : "offline"}`;
    }).catch(() => {});

    async function dispatchPipeline() {
      const prompt = document.getElementById("txtInput").value.trim();
      if (!prompt) return;

      const btn = document.getElementById("sendBtn");
      const term = document.getElementById("term");
      btn.disabled = true;
      term.innerText = "Routing...";

      let decision;
      try {
        const routeRes = await fetch("/api/route", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt })
        });
        decision = await routeRes.json();
        if (!routeRes.ok) throw new Error(decision.error || "Routing failed");
      } catch (err) {
        term.innerText = "Error: " + err.message;
        btn.disabled = false;
        return;
      }

      document.getElementById("mModel").innerText = decision.modelName;
      document.getElementById("mScore").innerText = decision.complexityScore;
      document.getElementById("mConf").innerText = decision.confidence;
      document.getElementById("mCache").innerText = decision.cached ? "HIT" : "MISS";
      updateHistoryUI(prompt, decision);

      term.innerText = "";
      const sse = new EventSource(`/api/stream?model=${encodeURIComponent(decision.modelName)}&prompt=${encodeURIComponent(prompt)}`);
      sse.onmessage = (e) => {
        if (e.data === "[DONE]") { sse.close(); btn.disabled = false; return; }
        const data = JSON.parse(e.data);
        if (data.token) term.innerText += data.token;
        if (data.error) term.innerText += data.error;
      };
      sse.onerror = () => { sse.close(); btn.disabled = false; };
    }

    function updateHistoryUI(prompt, decision) {
      const list = document.getElementById("historyList");
      if (!list.querySelector(".hist-item")) list.innerHTML = "";

      const item = document.createElement("div");
      item.className = "hist-item";
      const title = document.createElement("b");
      title.textContent = decision.modelName;
      item.appendChild(title);
      if (decision.cached) {
        const badge = document.createElement("span");
        badge.className = "cache-badge";
        badge.textContent = "Cached";
        item.appendChild(badge);
      }
      item.appendChild(document.createElement("br"));
      item.appendChild(document.createTextNode(prompt.length > 60 ? prompt.slice(0, 60) + "..." : prompt));
      list.prepend(item);
    }
  </script>
</body>
</html>
